[project]
channels = ["conda-forge", "bioconda"]
name = "bam2fq"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
wf = "miniwdl run --cfg miniwdl.cfg -i inputs.json bam2fastqrg.wdl"
input-template = "miniwdl input-template bam2fastqrg.wdl"

[dependencies]
python = ">=3.13.2,<3.14"
shellcheck = ">=0.10.0,<0.11"
apptainer = ">=1.3.6,<2"
samtools = ">=1.21,<2"

[pypi-dependencies]
miniwdl = ">=1.12.1, <2"
miniwdl-slurm = ">=0.2.0, <0.3"
wdl-aid = ">=1.0.1, <2"
